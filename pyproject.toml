[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-promptfirewall"
version = "0.1.0"
description = "Sub-millisecond PII detection and prompt injection firewall for LangChain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Timur Rakhmatullin", email = "timur.rakhmatullin86@gmail.com" },
]
keywords = [
    "langchain",
    "promptfirewall",
    "pii",
    "injection",
    "security",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: LangChain",
]
dependencies = [
    "langchain-core>=0.3.0",
    "promptfirewall-rs>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/timurua/langchain-promptfirewall"
Repository = "https://github.com/timurua/langchain-promptfirewall"
Issues = "https://github.com/timurua/langchain-promptfirewall/issues"
Documentation = "https://github.com/timurua/langchain-promptfirewall#readme"

[tool.hatch.build.targets.wheel]
packages = ["langchain_promptfirewall"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
